<script>
// -------------------------------------------------------------------------
//  Galaxian -- sound.
//
//  Everything here is synthesised from scratch with Web Audio: oscillators,
//  sweeps and filtered noise.  No samples and no ROM audio -- this is an
//  imitation of the cabinet's sound, built by ear, not a reproduction of its
//  circuit.
//
//  Safe to load headless: if there is no AudioContext every entry point is a
//  no-op, so build/preview.js can run the engine without a browser.
// -------------------------------------------------------------------------
const Sfx = (() => {
  const AC = typeof AudioContext !== 'undefined' ? AudioContext
           : (typeof webkitAudioContext !== 'undefined' ? webkitAudioContext : null);

  let ctx = null, master = null, muted = false;
  let noiseBuf = null;

  // --- the pulsing background thrum ---------------------------------------
  // A two-note descending figure that repeats.  On the real machine it speeds
  // up as the wave is cleared; here `setThrum(0..1)` takes the fraction of the
  // wave already destroyed and shortens the period accordingly.
  let thrumTimer = null, thrumStep = 0, thrumRate = 0;

  function init() {
    if (ctx || !AC) return;
    try {
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.25;
      master.connect(ctx.destination);

      // one second of white noise, reused by every percussive sound
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { ctx = null; }
  }

  const ready = () => {
    if (!ctx) return false;
    if (ctx.state === 'suspended') ctx.resume();
    return !muted;
  };

  const now = () => ctx.currentTime;

  // A tone with an optional frequency sweep and a short percussive envelope.
  function tone({ type = 'square', f0, f1, dur, gain = 0.3, delay = 0,
                  attack = 0.005 }) {
    if (!ready()) return null;
    const t = now() + delay;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 !== undefined && f1 !== f0) {
      o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    }
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.02);
    return o;
  }

  // Filtered noise -- the basis of every explosion.
  function noise({ dur, gain = 0.4, f0 = 2200, f1 = 120, q = 1, delay = 0 }) {
    if (!ready()) return;
    const t = now() + delay;
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf;
    src.loop = true;
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.Q.value = q;
    bp.frequency.setValueAtTime(f0, t);
    bp.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(bp); bp.connect(g); g.connect(master);
    src.start(t); src.stop(t + dur + 0.02);
  }

  // --- background thrum ---------------------------------------------------
  function thrumTick() {
    if (!ready()) return;
    // alternating low pair, the classic Galaxian "heartbeat"
    const base = 55 + thrumRate * 26;
    const f = thrumStep % 2 === 0 ? base : base * 0.75;
    tone({ type: 'square', f0: f, f1: f * 0.92, dur: 0.11, gain: 0.22 });
    thrumStep++;
  }

  function scheduleThrum() {
    if (thrumTimer) clearInterval(thrumTimer);
    if (!ctx) return;
    // 620ms when the wave is untouched, down to ~150ms with one alien left
    const period = 620 - 470 * thrumRate;
    thrumTimer = setInterval(thrumTick, period);
  }

  return {
    init,

    // `cleared` is 0..1 -- the fraction of the wave already destroyed
    setThrum(cleared) {
      const r = Math.max(0, Math.min(1, cleared));
      if (Math.abs(r - thrumRate) < 0.02 && thrumTimer) return;
      thrumRate = r;
      scheduleThrum();
    },
    // the cabinet had one heartbeat and no soundtrack, so these are no-ops.
    // The X cues are here for the same reason: the engine calls the sound bank
    // without asking which one it got.
    setTrack() {},
    trackName() { return ''; },
    setComplex() {},
    pickup() {}, nova() {}, shieldHit() {},
    cycle() {}, arm() {}, escalate() {}, plating() {},

    thrumOn() { if (!thrumTimer) scheduleThrum(); },
    thrumOff() { if (thrumTimer) { clearInterval(thrumTimer); thrumTimer = null; } },

    // player's shot: a short bright downward chirp
    shoot() { tone({ type: 'square', f0: 1500, f1: 320, dur: 0.13, gain: 0.22 }); },

    // an alien is hit
    boom() {
      noise({ dur: 0.34, gain: 0.5, f0: 2600, f1: 160, q: 0.8 });
      tone({ type: 'square', f0: 340, f1: 70, dur: 0.26, gain: 0.16 });
    },

    // the flagship is hit -- deeper and longer
    bossBoom() {
      noise({ dur: 0.55, gain: 0.6, f0: 1900, f1: 90, q: 0.7 });
      tone({ type: 'sawtooth', f0: 260, f1: 45, dur: 0.5, gain: 0.2 });
    },

    // the player's ship is destroyed
    death() {
      noise({ dur: 1.0, gain: 0.65, f0: 1400, f1: 60, q: 0.5 });
      tone({ type: 'sawtooth', f0: 420, f1: 40, dur: 0.9, gain: 0.28 });
      tone({ type: 'square', f0: 180, f1: 30, dur: 1.0, gain: 0.2, delay: 0.05 });
    },

    // an alien peels out of the formation -- the descending swoop whine
    dive(isBoss) {
      tone({ type: 'sawtooth', f0: isBoss ? 900 : 1250, f1: isBoss ? 150 : 260,
             dur: isBoss ? 0.75 : 0.55, gain: 0.13 });
    },

    extraLife() {
      const seq = [523, 659, 784, 1047];
      seq.forEach((f, i) => tone({ f0: f, dur: 0.16, gain: 0.24, delay: i * 0.11 }));
    },

    stageClear() {
      const seq = [392, 523, 659, 784, 1047];
      seq.forEach((f, i) => tone({ f0: f, dur: 0.14, gain: 0.22, delay: i * 0.09 }));
    },

    start() {
      const seq = [262, 330, 392, 523, 659, 784];
      seq.forEach((f, i) => tone({ f0: f, dur: 0.13, gain: 0.24, delay: i * 0.1 }));
    },

    gameOver() {
      const seq = [523, 415, 330, 262, 196];
      seq.forEach((f, i) => tone({ type: 'square', f0: f, dur: 0.28, gain: 0.24,
                                   delay: i * 0.2 }));
    },

    setMuted(m) {
      muted = m;
      if (master) master.gain.value = muted ? 0 : 0.25;
    },
    toggleMute() {
      muted = !muted;
      if (master) master.gain.value = muted ? 0 : 0.25;
      return muted;
    },
    isMuted() { return muted; },
  };

<script>
// -------------------------------------------------------------------------
//  GALAXIANS 2026 -- sound.
//
//  Exposes exactly the same interface as Sfx in audio.js, so the engine can
//  swap between the two without knowing which is playing.  Everything is
//  synthesised live: a proper bus with convolution reverb and a tempo-synced
//  delay, layered effects, and a synthwave soundtrack whose intensity rises as
//  the wave is cleared.
//
//  `thrumOn` / `setThrum` / `thrumOff` map onto the soundtrack, which is what
//  the retro build uses them for too.
// -------------------------------------------------------------------------
const NeoAudio = (() => {
  const AC = typeof AudioContext !== 'undefined' ? AudioContext
           : (typeof webkitAudioContext !== 'undefined' ? webkitAudioContext : null);

  let ctx = null, muted = false;
  let master, comp, dry, revIn, delIn, noiseBuf, duck;

  // --- music state --------------------------------------------------------
  let timer = null, step = 0, nextTime = 0, intensity = 0, musicOn = false;
  let track = null, SPB = 60 / 132 / 4, delayNode = null;
  // X runs the deeper arrangement: eight-bar forms with sections, a sidechain
  // duck under the kick, sixteenth bass patterns and a counter-melody.
  let complex = false;
  const LOOKAHEAD = 0.12;

  function init() {
    if (ctx || !AC) return;
    try {
      ctx = new AC();

      master = ctx.createGain();
      master.gain.value = muted ? 0 : 0.9;

      comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -14;
      comp.knee.value = 22;
      comp.ratio.value = 5;
      comp.attack.value = 0.004;
      comp.release.value = 0.22;
      comp.connect(master);
      master.connect(ctx.destination);

      dry = ctx.createGain();
      dry.gain.value = 1;
      dry.connect(comp);

      // A second dry path for the sequencer only.  The X arrangement pulls it
      // down on every kick, so the bass and pads breathe around the beat
      // without the game's own effects being ducked with them.
      duck = ctx.createGain();
      duck.gain.value = 1;
      duck.connect(comp);

      // convolution reverb from a procedurally decayed noise burst
      const rev = ctx.createConvolver();
      rev.buffer = makeIR(2.6, 3.1);
      const revGain = ctx.createGain();
      revGain.gain.value = 0.5;
      revIn = ctx.createGain();
      revIn.gain.value = 1;
      revIn.connect(rev); rev.connect(revGain); revGain.connect(comp);

      // tempo-synced feedback delay, rolled off so it sits behind everything
      const del = ctx.createDelay(1.5);
      delayNode = del;
      del.delayTime.value = SPB * 3;
      const fb = ctx.createGain();
      fb.gain.value = 0.38;
      const damp = ctx.createBiquadFilter();
      damp.type = 'lowpass';
      damp.frequency.value = 2000;
      const delOut = ctx.createGain();
      delOut.gain.value = 0.42;
      delIn = ctx.createGain();
      delIn.gain.value = 1;
      delIn.connect(del);
      del.connect(damp); damp.connect(fb); fb.connect(del);
      del.connect(delOut); delOut.connect(comp);

      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { ctx = null; }
  }

  function makeIR(sec, decay) {
    const n = Math.floor(ctx.sampleRate * sec);
    const buf = ctx.createBuffer(2, n, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = buf.getChannelData(c);
      for (let i = 0; i < n; i++) {
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, decay);
      }
    }
    return buf;
  }

  const ready = () => {
    if (!ctx) return false;
    if (ctx.state === 'suspended') ctx.resume();
    return true;
  };
  const now = () => ctx.currentTime;

  // --- voice helpers ------------------------------------------------------
  function env(g, t, a, d, peak, sus, rel) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0001, sus), t + a + d);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d + rel);
  }

  // A detuned pair of oscillators through a filter -- the workhorse voice.
  function voice(o) {
    if (!ready()) return;
    const t = (o.at !== undefined ? o.at : now()) + (o.delay || 0);
    const g = ctx.createGain();
    const f = ctx.createBiquadFilter();
    f.type = o.filter || 'lowpass';
    f.frequency.setValueAtTime(o.cut || 3000, t);
    if (o.cutEnd !== undefined) {
      f.frequency.exponentialRampToValueAtTime(Math.max(60, o.cutEnd),
                                               t + (o.cutTime || o.dur));
    }
    f.Q.value = o.q || 1;

    const n = o.voices || 2;
    for (let i = 0; i < n; i++) {
      const osc = ctx.createOscillator();
      osc.type = o.type || 'sawtooth';
      osc.frequency.setValueAtTime(o.f0, t);
      if (o.f1 !== undefined) {
        osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.f1), t + o.dur);
      }
      osc.detune.value = (i - (n - 1) / 2) * (o.spread === undefined ? 12 : o.spread);
      osc.connect(f);
      osc.start(t);
      osc.stop(t + o.dur + (o.rel || 0.05) + 0.05);
    }
    env(g, t, o.a || 0.005, o.d || o.dur * 0.6, (o.gain || 0.2) / Math.sqrt(n),
        (o.sus !== undefined ? o.sus : (o.gain || 0.2) * 0.3) / Math.sqrt(n),
        o.rel || 0.08);
    f.connect(g);
    g.connect(o.duck ? duck : dry);
    if (o.rev) { const s = ctx.createGain(); s.gain.value = o.rev; g.connect(s); s.connect(revIn); }
    if (o.del) { const s = ctx.createGain(); s.gain.value = o.del; g.connect(s); s.connect(delIn); }
  }

  // FM bell -- a carrier whose frequency is pushed by a modulator, used for
  // the X arrangement's counter-melody so it does not sound like another saw.
  function bell(o) {
    if (!ready()) return;
    const t = (o.at !== undefined ? o.at : now()) + (o.delay || 0);
    const car = ctx.createOscillator();
    const mod = ctx.createOscillator();
    const mg = ctx.createGain();
    const g = ctx.createGain();
    car.type = 'sine'; mod.type = 'sine';
    car.frequency.setValueAtTime(o.f0, t);
    mod.frequency.setValueAtTime(o.f0 * (o.ratio || 2.01), t);
    mg.gain.setValueAtTime(o.f0 * (o.index || 3), t);
    mg.gain.exponentialRampToValueAtTime(o.f0 * 0.05, t + o.dur);
    mod.connect(mg); mg.connect(car.frequency);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(o.gain || 0.1, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
    car.connect(g); g.connect(o.duck ? duck : dry);
    if (o.rev) { const s = ctx.createGain(); s.gain.value = o.rev; g.connect(s); s.connect(revIn); }
    if (o.del) { const s = ctx.createGain(); s.gain.value = o.del; g.connect(s); s.connect(delIn); }
    car.start(t); mod.start(t);
    car.stop(t + o.dur + 0.05); mod.stop(t + o.dur + 0.05);
  }

  function noise(o) {
    if (!ready()) return;
    const t = (o.at !== undefined ? o.at : now()) + (o.delay || 0);
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf;
    src.loop = true;
    src.playbackRate.value = o.rate || 1;
    const f = ctx.createBiquadFilter();
    f.type = o.filter || 'bandpass';

    if (o.rev) { const s = ctx.createGain(); s.gain.value = o.rev; g.connect(s); s.connect(revIn); }
    if (o.del) { const s = ctx.createGain(); s.gain.value = o.del; g.connect(s); s.connect(delIn); }
    src.start(t); src.stop(t + o.dur + 0.05);

    const t = (o.at !== undefined ? o.at : now()) + (o.delay || 0);

    osc.type = 'sine';
    osc.frequency.setValueAtTime(o.f0, t);

    g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);

      hat:  '....x.......x...', ride: 'x...x...x...x...',

      lead: [0, -1, -1, -1, 3, -1, -1, -1, 7, -1, -1, 5, -1, -1, 3, -1],
      counter: [12, -1, -1, -1, -1, -1, 10, -1, -1, -1, -1, -1, 9, -1, -1, -1],
      wave: 'sawtooth', sub: true,
    },
    {
      name: 'TERMINAL VELOCITY', bpm: 168, key: 'G', scale: PHRYG,
      leadRoot: nf('G', 5),
      prog: [m('G', 3), M('D#', 4), M('F', 4), m('G', 3),
             m('G', 3), M('C#', 4), M('D#', 4), M('F', 4)],
      kick: 'o.o.x.o.o.o.x.o.', snare: '....o..o....o.oo',
      hat:  'xxxxxxxxxxxxxxxx', ride: 'x.x.x.x.x.x.x.x.',
      bass: [0, 0, 3, 0, -1, 0, 5, 0, -1, 0, 3, -1, 7, -1, 5, 3],
      lead: [0, 0, -1, 3, 3, -1, 5, -1, 7, 7, -1, 5, 3, -1, 0, -1],
      counter: [-1, 12, -1, 15, -1, -1, 17, -1, -1, 15, -1, -1, 12, -1, -1, -1],
      wave: 'square', sub: true,
    },
    {
      name: 'LAST LIGHT', bpm: 138, key: 'D', scale: MINOR, leadRoot: nf('D', 5),
      prog: [m('D', 3), M('A#', 3), M('F', 3), M('C', 4),
             m('D', 3), m('G', 3), M('A#', 3), M('C', 4)],
      kick: 'o..x..o...x.o..o', snare: '....o.......o...',
      hat:  'x.x.x.xxx.x.x.xx', ride: '..x...x...x...x.',
      bass: [0, -1, 7, -1, 0, 12, -1, 7, -1, 0, -1, 10, 7, -1, 5, -1],
      lead: [7, -1, 5, -1, 3, -1, 5, 7, -1, 10, -1, 7, 5, -1, 3, -1],
      counter: [-1, -1, 14, -1, -1, 12, -1, -1, 10, -1, -1, 12, -1, -1, -1, -1],
      wave: 'sawtooth', sub: true,
    },
    {
      name: 'GALAXIAN X', bpm: 146, key: 'A', scale: PHRYG, leadRoot: nf('A', 5),
      prog: [m('A', 3), M('F', 3), M('A#', 3), M('E', 3),
             m('A', 3), M('F', 3), M('G', 3), M('E', 3)],
      kick: 'o..x..o.o..x..x.', snare: '....o..x....o.oo',
      hat:  'xxx.xxx.xxx.xxxx', ride: 'x...x...x...x...',
      bass: [0, 0, -1, 1, -1, 0, 7, -1, 0, -1, 5, -1, 3, 1, 0, -1],
      lead: [0, -1, 1, -1, 3, -1, 1, 0, -1, 5, -1, 3, 1, -1, 0, -1],
      counter: [12, -1, -1, 13, -1, -1, 15, -1, -1, -1, 13, -1, -1, 12, -1, -1],
      wave: 'square', sub: true,
    },
  ];

  // Section wheel, one entry per two bars of the eight-bar form: how much of
  // the arrangement is switched on regardless of how the wave is going.
  //   [drums, bass, arp, lead, counter, pad]
  const SECTIONS = [
    [0.55, 1, 0.35, 0, 0.4, 1],     // intro
    [1.00, 1, 1.00, 1, 0.6, 1],     // groove
    [1.00, 1, 1.00, 1, 1.0, 1],     // lift
    [0.35, 0, 0.60, 0, 1.0, 1],     // break
  ];

  function useTrack(t) {
    track = t;
    SPB = 60 / t.bpm / 4;
    if (delayNode) delayNode.delayTime.value = SPB * 3;
  }
  useTrack(TRACKS[0]);

  const activeList = () => (complex ? XTRACKS : TRACKS);

  // scale degree -> Hz above a root
  function deg(rootHz, sc, d) {
    const semi = sc[((d % sc.length) + sc.length) % sc.length]
               + 12 * Math.floor(d / sc.length);
    return rootHz * Math.pow(2, semi / 12);
  }

  // The kick pushes the melodic bus down and lets it back up over an eighth,
  // which is the single biggest thing that makes a synth mix feel produced.
  function sidechain(t, depth) {
    if (!duck) return;
    duck.gain.cancelScheduledValues(t);
    duck.gain.setValueAtTime(1, t);
    duck.gain.linearRampToValueAtTime(1 - depth, t + 0.012);
    duck.gain.linearRampToValueAtTime(1, t + SPB * 2.0);
  }

  function scheduleX(i, t) {
    const T = track;
    const bar = (i >> 4) % T.prog.length;
    const s = i & 15;
    const p = T.prog[bar];
    const I = intensity;
    const sec = SECTIONS[(bar >> 1) % SECTIONS.length];
    const [dLvl, bLvl, aLvl, lLvl, cLvl] = sec;
    const last = bar === T.prog.length - 1;      // the phrase-ending bar
    const D = { duck: true };

    // --- drums ---
    const kickHit = T.kick[s];
    if (kickHit !== '.' && (dLvl > 0.5 || kickHit === 'o')) {
      const hard = kickHit === 'o';
      thump({ at: t, f0: hard ? 165 : 140, f1: 40,
              dur: hard ? 0.30 : 0.22, gain: hard ? 0.95 : 0.6 });
      noise({ at: t, f0: 2200, f1: 380, dur: 0.026, gain: 0.16, q: 0.7 });
      sidechain(t, (hard ? 0.42 : 0.26) * (0.6 + 0.4 * I));
    }
    if (T.snare[s] !== '.') {
      noise({ at: t, f0: 2600, f1: 950, dur: 0.17, gain: 0.34 * (0.6 + 0.4 * dLvl),
              q: 0.6, rev: 0.30 });
      noise({ at: t, f0: 380, f1: 200, dur: 0.09, gain: 0.16, q: 1.2,
              filter: 'lowpass' });
      voice({ at: t, type: 'triangle', f0: 230, f1: 150, dur: 0.09, gain: 0.12,
              voices: 1, cut: 3000, ...D });
    }
    const hatOn = I > 0.55 || dLvl > 0.9;
    if (T.hat[s] !== '.' && (hatOn || s % 4 === 0)) {
      const open = s % 8 === 6;
      noise({ at: t, f0: 9500, f1: 6800, dur: open ? 0.11 : 0.03,
              gain: (open ? 0.10 : 0.07) * dLvl, q: 1.4, filter: 'highpass' });
    }
    if (T.ride[s] !== '.' && I > 0.35 && dLvl > 0.9) {
      noise({ at: t, f0: 7200, f1: 5400, dur: 0.24, gain: 0.045, q: 2.2,
              filter: 'highpass', rev: 0.3 });
    }
    // tom fill across the last half-bar of a phrase
    if (last && s >= 12) {
      const n = s - 12;
      thump({ at: t, f0: 260 - n * 42, f1: 70 - n * 8, dur: 0.16, gain: 0.5 });
      if (s === 15) {
        noise({ at: t, f0: 800, f1: 11000, dur: SPB * 4, gain: 0.10, q: 0.7,
                rev: 0.5 });
      }
    }

    // --- bass: a sixteenth pattern, with a sine sub underneath ---
    if (bLvl > 0) {
      const d = T.bass[s];
      if (d >= 0) {
        const f = deg(p.root, T.scale, d);
        voice({ at: t, type: T.wave, f0: f, dur: SPB * 1.35,
                gain: 0.30, voices: 2, spread: 9,
                cut: 240 + 900 * I, cutEnd: 140 + 320 * I, q: 8,
                a: 0.005, d: 0.08, sus: 0.1, rel: 0.08, ...D });
        if (T.sub && s % 2 === 0) {
          voice({ at: t, type: 'sine', f0: f / 2, dur: SPB * 1.6, gain: 0.26,
                  voices: 1, cut: 200, q: 0.7, a: 0.008, d: 0.12, sus: 0.12,
                  rel: 0.1, ...D });
        }
      }
    }

    // --- arpeggio: sixteenths through the delay, wider as the wave thins ---
    if (aLvl > 0 && I > 0.08) {
      const tone = p.chord[(i * 3 + (s & 3)) % p.chord.length]
                 * ((s % 8 === 7) ? 2 : 1);
      voice({ at: t, type: 'square', f0: tone, dur: 0.09,
              gain: (0.075 + 0.05 * I) * aLvl, voices: 2, spread: 18,
              cut: 1500 + 3600 * I, q: 4,
              a: 0.003, d: 0.045, sus: 0.001, rel: 0.055,
              del: 0.44, rev: 0.2, ...D });
    }

    // --- pad: a seventh chord, one long note per bar ---
    if (s === 0) {
      const seventh = p.chord[0] * Math.pow(2, 10 / 12);
      for (const f of p.chord.concat([seventh])) {
        voice({ at: t, type: 'sawtooth', f0: f / 2, dur: SPB * 15,
                gain: 0.045 + 0.028 * I, voices: 3, spread: 24,
                cut: 620 + 1700 * I, q: 1.2,
                a: 0.5, d: SPB * 8, sus: 0.03, rel: 0.7, rev: 0.6, ...D });
      }
    }

    // --- lead: supersaw, once the section and the wave both allow it ---
    if (lLvl > 0 && I > 0.45) {
      const d = T.lead[s];
      if (d >= 0) {
        voice({ at: t, type: 'sawtooth', f0: deg(T.leadRoot, T.scale, d),
                dur: 0.15, gain: 0.095, voices: 5, spread: 26,
                cut: 3400, q: 3, a: 0.008, d: 0.09, sus: 0.02, rel: 0.16,
                del: 0.5, rev: 0.35, ...D });
      }
    }

    // --- counter-melody: an FM bell answering in the gaps ---
    if (cLvl > 0.3) {
      const d = T.counter[s];
      if (d >= 0) {
        bell({ at: t, f0: deg(T.leadRoot, T.scale, d), dur: 0.55,
               gain: 0.075 * cLvl, ratio: 2.01, index: 2.4,
               del: 0.4, rev: 0.5, ...D });
      }
    }
  }

  function schedule(i, t) {
    const T = track;
    const bar = (i >> 4) % T.prog.length;
    const s = i & 15;                       // sixteenth within the bar
    const p = T.prog[bar];
    const I = intensity;

    // --- drums ---
    if (s % 8 === 0) {                      // kick on 1 and 3
      thump({ at: t, f0: 150, f1: 42, dur: 0.28, gain: 0.85 });
      noise({ at: t, f0: 1800, f1: 400, dur: 0.03, gain: 0.18, q: 0.7 });
    }
    if (I > 0.45 && (s === 14 || s === 6)) {
      thump({ at: t, f0: 130, f1: 44, dur: 0.18, gain: 0.5 });
    }
    if (s % 8 === 4) {                      // snare on 2 and 4
      noise({ at: t, f0: 2400, f1: 900, dur: 0.16, gain: 0.34, q: 0.6, rev: 0.28 });
      voice({ at: t, type: 'triangle', f0: 220, f1: 150, dur: 0.1, gain: 0.14,
              voices: 1, cut: 3000 });
    }
    // hats: each track has its own base division, doubling when it gets busy
    const hatEvery = I > 0.6 ? Math.max(1, T.hat >> 1) : T.hat;
    if (s % hatEvery === 0) {
      noise({ at: t, f0: 9000, f1: 6500, dur: s % 4 === 2 ? 0.06 : 0.032,
              gain: s % 4 === 0 ? 0.12 : 0.075, q: 1.4, filter: 'highpass' });
    }

    // --- bass: root on eighths, lifting an octave on the track's accents ---
    if (s % 2 === 0) {
      const oct = T.bassLift.indexOf(s) >= 0 ? 2 : 1;
      voice({ at: t, type: T.wave, f0: p.root * oct, dur: SPB * 1.7,
              gain: 0.34, voices: 2, spread: 8,
              cut: 260 + 700 * I, cutEnd: 150 + 260 * I, q: 7,
              a: 0.006, d: 0.09, sus: 0.1, rel: 0.09 });
    }

    // --- arpeggio: sixteenth plucks through the chord, into the delay ---
    if (I > 0.12) {
      const tone = p.chord[(i * 3 + (s & 3)) % p.chord.length]
                 * ((s % 8 === 7) ? 2 : 1);
      voice({ at: t, type: 'square', f0: tone, dur: 0.1,
              gain: 0.09 + 0.05 * I, voices: 2, spread: 16,
              cut: 1600 + 3200 * I, q: 4,
              a: 0.003, d: 0.05, sus: 0.001, rel: 0.06,
              del: 0.42, rev: 0.2 });
    }

    // --- pad: one long detuned chord per bar ---
    if (s === 0) {
      for (const f of p.chord) {
        voice({ at: t, type: 'sawtooth', f0: f / 2, dur: SPB * 15,
                gain: 0.055 + 0.03 * I, voices: 3, spread: 22,
                cut: 700 + 1500 * I, q: 1.2,
                a: 0.4, d: SPB * 8, sus: 0.03, rel: 0.6, rev: 0.55 });
      }
    }

    // --- lead motif, only once the wave is thinning out ---
    if (I > 0.62) {
      const d = T.lead[s];
      if (d >= 0) {
        const sc = T.scale;
        const semi = sc[d % sc.length] + 12 * Math.floor(d / sc.length);
        voice({ at: t, type: 'sawtooth', f0: T.leadRoot * Math.pow(2, semi / 12),
                dur: 0.16, gain: 0.1, voices: 3, spread: 20,
                cut: 3200, q: 3, a: 0.01, d: 0.1, sus: 0.02, rel: 0.14,
                del: 0.5, rev: 0.35 });
      }
    }
  }

  function pump() {
    if (!ctx || !musicOn) return;
    while (nextTime < ctx.currentTime + LOOKAHEAD) {
      if (nextTime < ctx.currentTime) nextTime = ctx.currentTime + 0.02;
      (complex ? scheduleX : schedule)(step, nextTime);
      step++;
      nextTime += SPB;
    }
  }

  return {
    init,

    setThrum(cleared) { intensity = Math.max(0, Math.min(1, cleared)); },

    // X swaps in the deeper arrangement and its own set of tracks
    setComplex(on) {
      const want = !!on;
      if (want === complex) return;
      complex = want;
      // the track we were on belongs to the other list; the engine follows
      // this with setTrack(stage), which lands on the right one
      useTrack(activeList()[0]);
      step = 0;
      if (duck) duck.gain.value = 1;
      if (musicOn && ctx) nextTime = ctx.currentTime + 0.05;
    },
    isComplex() { return complex; },

    // one track per level, cycling once they run out
    setTrack(stage) {
      const list = activeList();
      const t = list[Math.max(0, (stage | 0) - 1) % list.length];
      if (t === track) return;
      useTrack(t);
      step = 0;                     // restart the loop on the new bar line
      if (musicOn && ctx) nextTime = ctx.currentTime + 0.05;
    },
    trackName() { return track ? track.name : ''; },
    trackCount() { return activeList().length; },
    trackList() { return activeList().map(t => t.name); },

    thrumOn() {
      init();
      if (!ctx || musicOn) return;
      musicOn = true;
      nextTime = ctx.currentTime + 0.06;
      if (timer) clearInterval(timer);
      timer = setInterval(pump, 25);
    },
    thrumOff() {
      musicOn = false;
      if (timer) { clearInterval(timer); timer = null; }
    },

    // --- effects ----------------------------------------------------------
    shoot() {
      voice({ type: 'sawtooth', f0: 2400, f1: 420, dur: 0.13, gain: 0.16,
              voices: 2, spread: 30, cut: 6000, cutEnd: 900, q: 6,
              a: 0.002, d: 0.07, sus: 0.001, rel: 0.05, del: 0.16 });
      noise({ f0: 5200, f1: 1200, dur: 0.06, gain: 0.1, q: 1.2 });
    },

    boom() {
      thump({ f0: 190, f1: 34, dur: 0.42, gain: 0.55 });
      noise({ f0: 3200, f1: 220, dur: 0.42, gain: 0.4, q: 0.7, rev: 0.4 });
      voice({ type: 'sawtooth', f0: 420, f1: 60, dur: 0.26, gain: 0.12,
              voices: 2, cut: 2400, cutEnd: 300, q: 3, rel: 0.15 });
    },

    bossBoom() {
      thump({ f0: 220, f1: 26, dur: 0.85, gain: 0.8 });
      noise({ f0: 2600, f1: 120, dur: 0.8, gain: 0.5, q: 0.6, rev: 0.65 });
      voice({ type: 'sawtooth', f0: 300, f1: 40, dur: 0.6, gain: 0.18,
              voices: 3, spread: 25, cut: 2000, cutEnd: 200, q: 4, rel: 0.35,
              rev: 0.4 });
      voice({ type: 'square', f0: 1600, f1: 200, dur: 0.3, gain: 0.08,
              voices: 2, cut: 5000, cutEnd: 600, q: 5, delay: 0.03, del: 0.3 });
    },

    death() {
      thump({ f0: 260, f1: 18, dur: 1.5, gain: 0.9 });
      noise({ f0: 4000, f1: 60, dur: 1.4, gain: 0.55, q: 0.5, rev: 0.8 });
      voice({ type: 'sawtooth', f0: 520, f1: 30, dur: 1.2, gain: 0.22,
              voices: 4, spread: 40, cut: 3000, cutEnd: 120, q: 6, rel: 0.5,
              rev: 0.6 });
      // the reversed-swell tail
      voice({ type: 'triangle', f0: 60, f1: 300, dur: 0.9, gain: 0.1,
              voices: 2, cut: 1200, delay: 0.35, a: 0.5, rev: 0.7 });
    },

    dive(isBoss) {
      voice({ type: 'sawtooth', f0: isBoss ? 1300 : 1900,
              f1: isBoss ? 190 : 340, dur: isBoss ? 0.85 : 0.6,
              gain: isBoss ? 0.12 : 0.08, voices: 3, spread: 26,
              cut: 4200, cutEnd: 500, q: 9,
              a: 0.02, d: 0.3, sus: 0.01, rel: 0.2, rev: 0.3, del: 0.18 });
    },

    // --- X cues -----------------------------------------------------------
    // A pod collected: a short rising arpeggio, keyed off which pod it was so
    // the five pickups are tellable apart without looking.
    pickup(kind) {
      const base = { beam: 523.25, rapid: 587.33, shield: 440,
                     score: 659.25, nova: 349.23 }[kind] || 523.25;
      [0, 7, 12].forEach((s, i) =>
        voice({ type: 'triangle', f0: base * Math.pow(2, s / 12), dur: 0.14,
                gain: 0.15, voices: 2, spread: 10, cut: 6000, q: 2,
                delay: i * 0.045, a: 0.004, d: 0.07, sus: 0.01, rel: 0.12,
                rev: 0.35, del: 0.25 }));
      bell({ f0: base * 2, dur: 0.5, gain: 0.09, ratio: 3.01, index: 2,
             delay: 0.09, rev: 0.5, del: 0.3 });
      noise({ f0: 3000, f1: 11000, dur: 0.18, gain: 0.07, q: 1.1 });
    },

    // Cycling the hold: a dry tick, quiet enough to hold down.
    cycle() {
      voice({ type: 'square', f0: 1400, f1: 1900, dur: 0.05, gain: 0.07,
              voices: 1, cut: 5000, q: 1, a: 0.002, d: 0.02, sus: 0.001,
              rel: 0.03 });
    },

    // Spending a pod: the loadout comes online.
    arm(kind) {
      const base = { beam: 261.63, rapid: 293.66, shield: 220,
                     score: 329.63, nova: 174.61 }[kind] || 261.63;
      [0, 7, 12, 19].forEach((s, i) =>
        voice({ type: 'sawtooth', f0: base * Math.pow(2, s / 12), dur: 0.3,
                gain: 0.16, voices: 4, spread: 20, cut: 800, cutEnd: 6500,
                cutTime: 0.35, q: 4, delay: i * 0.05, a: 0.01, d: 0.15,
                sus: 0.04, rel: 0.25, rev: 0.45, del: 0.3 }));
      thump({ f0: 120, f1: 45, dur: 0.35, gain: 0.55 });
    },

    // The swarm's answer: a descending minor-second sting, deliberately ugly.
    escalate() {
      [0, -1, -5, -12].forEach((s, i) =>
        voice({ type: 'sawtooth', f0: 330 * Math.pow(2, s / 12), dur: 0.5,
                gain: 0.15, voices: 4, spread: 34, cut: 2600, cutEnd: 420,
                cutTime: 0.6, q: 5, delay: i * 0.09, a: 0.02, d: 0.25,
                sus: 0.05, rel: 0.35, rev: 0.6 }));
      noise({ f0: 260, f1: 90, dur: 0.9, gain: 0.22, q: 0.8, rev: 0.7 });
      thump({ f0: 90, f1: 26, dur: 0.9, gain: 0.7, delay: 0.18 });
    },

    // A shot stopped by ARMOUR plating: metallic, and clearly not a kill.
    plating() {
      noise({ f0: 4200, f1: 2600, dur: 0.07, gain: 0.16, q: 3.2,
              filter: 'bandpass' });
      bell({ f0: 1500, dur: 0.16, gain: 0.07, ratio: 1.73, index: 5 });
    },

    // A shield charge soaking a hit: a hard bright clang, then a ring-down.
    shieldHit() {
      noise({ f0: 5500, f1: 900, dur: 0.22, gain: 0.3, q: 1.6, rev: 0.5 });
      bell({ f0: 880, dur: 0.9, gain: 0.16, ratio: 1.41, index: 4,
             rev: 0.7, del: 0.2 });
      voice({ type: 'sawtooth', f0: 300, f1: 900, dur: 0.3, gain: 0.1,
              voices: 3, spread: 22, cut: 900, cutEnd: 5000, cutTime: 0.3,
              q: 4, a: 0.004, d: 0.12, sus: 0.02, rel: 0.2 });
      thump({ f0: 140, f1: 40, dur: 0.3, gain: 0.4 });
    },

    // NOVA: a downward sweep into a wall of sub and noise.
    nova() {
      noise({ f0: 12000, f1: 120, dur: 1.1, gain: 0.5, q: 0.5, rev: 0.85 });
      thump({ f0: 300, f1: 18, dur: 1.6, gain: 0.95 });
      voice({ type: 'sawtooth', f0: 1800, f1: 60, dur: 1.0, gain: 0.22,
              voices: 5, spread: 42, cut: 6000, cutEnd: 200, q: 7, rel: 0.5,
              rev: 0.7 });
      [0, 5, 7, 12].forEach((s, i) =>
        bell({ f0: 220 * Math.pow(2, s / 12), dur: 1.4, gain: 0.10,
               ratio: 2.01, index: 3, delay: 0.05 + i * 0.04, rev: 0.8,
               del: 0.4 }));
    },

    extraLife() {
      [0, 4, 7, 12, 16].forEach((s, i) =>
        voice({ type: 'sawtooth', f0: A4 * Math.pow(2, s / 12), dur: 0.22,
                gain: 0.16, voices: 3, spread: 18, cut: 5000, q: 2,
                delay: i * 0.075, a: 0.01, d: 0.12, sus: 0.02, rel: 0.2,
                rev: 0.45, del: 0.35 }));
    },

    stageClear() {
      [0, 3, 7, 10, 12, 15].forEach((s, i) =>
        voice({ type: 'sawtooth', f0: A3 * Math.pow(2, s / 12), dur: 0.2,
                gain: 0.15, voices: 3, spread: 20, cut: 4600, q: 2,
                delay: i * 0.085, a: 0.008, d: 0.12, sus: 0.02, rel: 0.25,
                rev: 0.5, del: 0.4 }));
      noise({ f0: 400, f1: 9000, dur: 0.6, gain: 0.12, q: 0.8, rev: 0.5 });
    },

    start() {
      noise({ f0: 120, f1: 7000, dur: 0.9, gain: 0.18, q: 0.9, rev: 0.5 });
      [0, 7, 12].forEach((s, i) =>
        voice({ type: 'sawtooth', f0: A3 * Math.pow(2, s / 12), dur: 0.5,
                gain: 0.18, voices: 4, spread: 24, cut: 900, cutEnd: 5000,
                cutTime: 0.6, q: 3, delay: i * 0.1, a: 0.05, d: 0.3,
                sus: 0.05, rel: 0.4, rev: 0.5 }));
      thump({ f0: 200, f1: 40, dur: 0.7, gain: 0.8, delay: 0.28 });
    },

    gameOver() {
      [0, -3, -7, -12, -17].forEach((s, i) =>
        voice({ type: 'sawtooth', f0: A3 * Math.pow(2, s / 12), dur: 0.6,
                gain: 0.17, voices: 3, spread: 24, cut: 2600, cutEnd: 400,
                cutTime: 0.7, q: 3, delay: i * 0.22, a: 0.02, d: 0.35,
                sus: 0.04, rel: 0.4, rev: 0.65 }));
      thump({ f0: 90, f1: 20, dur: 1.6, gain: 0.7, delay: 0.9 });
    },

    setMuted(m) {
      muted = m;
      if (master) master.gain.value = muted ? 0 : 0.9;
    },
    isMuted() { return muted; },
  };
})();

<script>
// -------------------------------------------------------------------------
//  GALAXIANS 2026 -- the modern renderer.
//
//  Draws the exact same game state as the arcade renderer, at 4x the
//  resolution, with none of the original art.  The ships are vector forms with
//  baked glow, the swarm sits over a drifting nebula and a parallax starfield,
//  divers leave light ribbons that trace their swoop, kills throw particles and
//  shockwaves, and the whole frame gets a bloom pass.
//
//  Nothing in here touches the simulation -- update() is untouched, so the
//  flight paths, scoring and timings are identical in both versions.
// -------------------------------------------------------------------------
const Neo = (() => {
  const RES = 4;                       // device pixels per game pixel
  let VW = 0, VH = 0;                  // backing store size

  let cx = null;                       // the shared canvas context
  let scene, sx;                       // full-res offscreen we compose into
  let bloom, bx;                       // quarter-res blur target
  let neb, nx;                         // pre-baked nebula
  let canBlur = true;
  let inited = false;

  const art = {};                      // baked sprite canvases
  let dot = null, ring = null;

  const parts = [];
  const trails = new Map();            // alien -> array of past positions
  const angles = new Map();            // alien -> smoothed facing, radians
  let shake = 0, flash = 0, flashCol = '#fff';
  let tick = 0;

  const stars = [[], [], []];

  // --- palettes -----------------------------------------------------------
  const SKIN = {
    blue:   { hot: '#d7fbff', mid: '#22b8e6', low: '#0a3c62', glow: '#3fd9ff' },
    purple: { hot: '#f7d0ff', mid: '#a63cdc', low: '#3d0d5c', glow: '#c558ff' },
    red:    { hot: '#ffe0b4', mid: '#ff4b28', low: '#5f1206', glow: '#ff6a34' },
    boss:   { hot: '#fff8cf', mid: '#ffb31f', low: '#6d3a00', glow: '#ffc93c' },
  };
  const SHIP = { hull: '#e8f0ff', trim: '#39e9ff', deep: '#25405e', glow: '#66e9ff' };

  const TAU = Math.PI * 2;

  // The renderer keeps its own random stream.  If it drew from Math.random it
  // would consume the same sequence the simulation does, and the two versions
  // would stop playing identically -- which is the one thing that must not
  // change between them.
  let seed = 0x2f6e2b1;
  function nrand() {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    return seed / 4294967296;
  }
  const rnd = (a, b) => a + nrand() * (b - a);

  function mkCanvas(w, h) {
    const c = (typeof document !== 'undefined' && document.createElement)
      ? document.createElement('canvas') : null;
    if (!c) return null;
    c.width = w; c.height = h;
    return c;
  }

  // -----------------------------------------------------------------------
  //  art baking -- every sprite is drawn once into an offscreen canvas with
  //  its glow already burned in, then just rotated and blitted per frame.
  // -----------------------------------------------------------------------
  function glowPath(g, path, fill, stroke, blur, glowCol) {
    g.save();
    if (blur) { g.shadowBlur = blur; g.shadowColor = glowCol; }
    g.fillStyle = fill;
    g.fill(path);
    g.restore();
    if (stroke) {
      g.strokeStyle = stroke;
      g.lineWidth = 1.6;
      g.lineJoin = 'round';
      g.stroke(path);
    }
  }

  // The alien: a swept-wing interceptor, nose pointing down the screen, drawn
  // in a unit space and scaled.  `flap` slides the wings for the idle animation.
  function alienPath(u, flap) {
    const p = new Path2D();
    const s = flap * 0.13;
    // body
    p.moveTo(0, 1.05 * u);
    p.lineTo(0.30 * u, 0.34 * u);
    p.lineTo(0.36 * u, -0.36 * u);
    p.lineTo(0.17 * u, -0.86 * u);
    p.lineTo(-0.17 * u, -0.86 * u);
    p.lineTo(-0.36 * u, -0.36 * u);
    p.lineTo(-0.30 * u, 0.34 * u);
    p.closePath();
    return p;
  }
  function wingPath(u, flap, side) {
    const p = new Path2D();
    const s = flap * 0.16;
    const k = side;
    p.moveTo(k * 0.28 * u, 0.18 * u);
    p.lineTo(k * (0.98 + s) * u, (-0.10 - s) * u);
    p.lineTo(k * (1.02 + s) * u, (-0.52 - s * 1.4) * u);
    p.lineTo(k * 0.62 * u, (-0.30 - s * 0.4) * u);
    p.lineTo(k * 0.34 * u, -0.34 * u);
    p.closePath();
    return p;
  }

  function bakeAlien(kind, flapIdx) {
    const S = SKIN[kind];
    const big = kind === 'boss';
    const size = big ? 116 : 96;
    const c = mkCanvas(size, size);
    if (!c) return null;
    const g = c.getContext('2d');
    g.translate(size / 2, size / 2);
    const u = (big ? 30 : 25);
    const flap = [0, 1, 0.5][flapIdx] || 0;

    // wings first so the body sits over them
    for (const side of [-1, 1]) {
      const w = wingPath(u, flap, side);
      const grad = g.createLinearGradient(side * u, -u, side * u * 0.2, u);
      grad.addColorStop(0, S.mid);
      grad.addColorStop(1, S.low);
      glowPath(g, w, grad, S.glow, 16, S.glow);
    }

    const body = alienPath(u, flap);
    const bg = g.createLinearGradient(0, -u, 0, u);
    bg.addColorStop(0, S.low);
    bg.addColorStop(0.45, S.mid);
    bg.addColorStop(1, S.hot);
    glowPath(g, body, bg, S.hot, 20, S.glow);

    // antennae
    g.strokeStyle = S.hot;
    g.lineWidth = 2;
    g.shadowBlur = 12; g.shadowColor = S.glow;
    g.beginPath();
    g.moveTo(-0.14 * u, -0.8 * u); g.lineTo(-0.30 * u, -1.25 * u);
    g.moveTo(0.14 * u, -0.8 * u); g.lineTo(0.30 * u, -1.25 * u);
    g.stroke();
    g.shadowBlur = 0;

    // glowing core
    const core = g.createRadialGradient(0, 0.05 * u, 0, 0, 0.05 * u, 0.5 * u);
    core.addColorStop(0, '#ffffff');
    core.addColorStop(0.35, S.hot);
    core.addColorStop(1, 'rgba(0,0,0,0)');
    g.globalCompositeOperation = 'lighter';
    g.fillStyle = core;
    g.beginPath();
    g.arc(0, 0.05 * u, 0.5 * u, 0, TAU);
    g.fill();

    if (big) {                        // flagship gets side pods and a crown
      g.globalCompositeOperation = 'source-over';
      g.fillStyle = S.hot;
      g.shadowBlur = 14; g.shadowColor = S.glow;
      for (const side of [-1, 1]) {
        g.beginPath();
        g.ellipse(side * 0.52 * u, 0.10 * u, 0.11 * u, 0.28 * u, 0, 0, TAU);
        g.fill();
      }
      g.shadowBlur = 0;
    }
    return c;
  }

  function bakePlayer(thrust) {
    const size = 110;
    const c = mkCanvas(size, size);
    if (!c) return null;
    const g = c.getContext('2d');
    g.translate(size / 2, size / 2);
    const u = 26;

    const p = new Path2D();
    p.moveTo(0, -1.05 * u);
    p.lineTo(0.20 * u, -0.30 * u);
    p.lineTo(0.72 * u, 0.16 * u);
    p.lineTo(0.94 * u, 0.60 * u);
    p.lineTo(0.44 * u, 0.44 * u);
    p.lineTo(0.30 * u, 0.86 * u);
    p.lineTo(-0.30 * u, 0.86 * u);
    p.lineTo(-0.44 * u, 0.44 * u);
    p.lineTo(-0.94 * u, 0.60 * u);
    p.lineTo(-0.72 * u, 0.16 * u);
    p.lineTo(-0.20 * u, -0.30 * u);
    p.closePath();

    const grad = g.createLinearGradient(0, -u, 0, u);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.4, SHIP.hull);
    grad.addColorStop(1, SHIP.deep);
    glowPath(g, p, grad, SHIP.trim, 18, SHIP.glow);

    // cockpit
    const cp = g.createLinearGradient(0, -0.6 * u, 0, 0.2 * u);
    cp.addColorStop(0, '#ffffff');
    cp.addColorStop(1, SHIP.trim);
    g.fillStyle = cp;
    g.shadowBlur = 14; g.shadowColor = SHIP.glow;
    g.beginPath();
    g.ellipse(0, -0.28 * u, 0.13 * u, 0.34 * u, 0, 0, TAU);
    g.fill();
    g.shadowBlur = 0;

    // engine nozzles
    g.globalCompositeOperation = 'lighter';
    for (const side of [-1, 1]) {
      const e = g.createRadialGradient(side * 0.17 * u, 0.8 * u, 0,
                                       side * 0.17 * u, 0.8 * u, 0.42 * u);
      e.addColorStop(0, '#ffffff');
      e.addColorStop(0.3, SHIP.trim);
      e.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = e;
      g.beginPath();
      g.arc(side * 0.17 * u, 0.8 * u, 0.42 * u, 0, TAU);
      g.fill();
    }
    return c;
  }

  function bakeDot() {
    const s = 64;
    const c = mkCanvas(s, s);
    if (!c) return null;
    const g = c.getContext('2d');
    const grad = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    grad.addColorStop(0, 'rgba(255,255,255,1)');
    grad.addColorStop(0.25, 'rgba(255,255,255,0.75)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grad;
    g.fillRect(0, 0, s, s);
    return c;
  }

  function bakeNebula() {
    neb = mkCanvas(VW >> 1, VH >> 1);
    if (!neb) return;
    nx = neb.getContext('2d');
    const w = neb.width, h = neb.height;
    nx.clearRect(0, 0, w, h);
    const blobs = [
      ['rgba(84,26,160,0.55)', 0.24, 0.18, 0.62],
      ['rgba(14,92,150,0.50)', 0.78, 0.34, 0.55],
      ['rgba(160,26,96,0.34)', 0.55, 0.72, 0.48],
      ['rgba(20,60,140,0.40)', 0.10, 0.80, 0.50],
      ['rgba(60,16,120,0.40)', 0.90, 0.92, 0.44],
    ];
    nx.globalCompositeOperation = 'lighter';
    for (const [col, px, py, pr] of blobs) {
      const r = pr * w;
      const grad = nx.createRadialGradient(px * w, py * h, 0, px * w, py * h, r);
      grad.addColorStop(0, col);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      nx.fillStyle = grad;
      nx.beginPath();
      nx.arc(px * w, py * h, r, 0, TAU);
      nx.fill();
    }
  }

  function makeStars() {
    const cfg = [[110, 0.30, 0.6, 0.35], [70, 0.65, 1.0, 0.6], [34, 1.25, 1.7, 1]];
    const cols = ['#ffffff', '#bcd8ff', '#ffd9c0', '#d8c0ff', '#c8fff0'];
    for (let l = 0; l < 3; l++) {
      const [n, sp, sz, br] = cfg[l];
      stars[l] = [];
      for (let i = 0; i < n; i++) {
        stars[l].push({
          x: nrand() * 224,
          y: nrand() * 256,
          r: sz * rnd(0.5, 1.1),
          sp, br,
          c: cols[(nrand() * cols.length) | 0],
          ph: nrand() * TAU,
        });
      }
    }
  }

  // -----------------------------------------------------------------------
  //  setup
  // -----------------------------------------------------------------------
  function ensure(canvasEl, ctx2d) {
    VW = 224 * RES; VH = 256 * RES;
    cx = ctx2d;
    if (inited) return;
    inited = true;

    scene = mkCanvas(VW, VH); sx = scene && scene.getContext('2d');
    bloom = mkCanvas(VW >> 2, VH >> 2); bx = bloom && bloom.getContext('2d');
    if (bx) {
      try { bx.filter = 'blur(4px)'; canBlur = bx.filter === 'blur(4px)'; }
      catch (e) { canBlur = false; }
      bx.filter = 'none';
    }
    bakeNebula();
    makeStars();

    for (const k of ['blue', 'purple', 'red', 'boss']) {
      art[k] = [0, 1, 2].map(f => bakeAlien(k, f));
    }
    art.ship = bakePlayer(0);
    dot = bakeDot();
  }

  // -----------------------------------------------------------------------
  //  particles
  // -----------------------------------------------------------------------
  function spark(x, y, col, spd, life, size) {
    const a = nrand() * TAU;
    const v = rnd(spd * 0.25, spd);
    parts.push({ t: 'spark', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
                 life, max: life, col, size });
  }

  function burst(x, y, col, hot, n, spd, big) {
    parts.push({ t: 'ring', x, y, r: 1, max: big ? 30 : 14, life: big ? 26 : 16,
                 lmax: big ? 26 : 16, col: hot });
    parts.push({ t: 'flash', x, y, r: big ? 13 : 6.5, life: 9, lmax: 9, col: hot });
    for (let i = 0; i < n; i++) {
      spark(x, y, nrand() < 0.35 ? hot : col, spd,
            rnd(14, big ? 46 : 30), rnd(0.5, big ? 1.5 : 1.05));
    }
    for (let i = 0; i < (big ? 14 : 6); i++) {
      const a = nrand() * TAU, v = rnd(0.4, spd * 0.8);
      parts.push({ t: 'shard', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
                   life: rnd(24, 56), max: 56, col, rot: nrand() * TAU,
                   spin: rnd(-0.28, 0.28), len: rnd(1.6, 4) });
    }
  }

  function updateParts() {
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life--;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      if (p.t === 'spark' || p.t === 'shard') {
        p.x += p.vx; p.y += p.vy;
        p.vx *= 0.94; p.vy *= 0.94;
        p.vy += 0.012;
        if (p.t === 'shard') p.rot += p.spin;
      } else if (p.t === 'ring') {
        p.r += (p.max - p.r) * 0.16;
      }
    }
  }

  function drawParts(g) {
    g.globalCompositeOperation = 'lighter';
    for (const p of parts) {
      const k = p.life / (p.lmax || p.max);
      if (p.t === 'spark') {
        const s = p.size * RES * (0.35 + k * 0.9);
        g.globalAlpha = Math.min(1, k * 1.2) * 0.85;
        g.fillStyle = p.col;
        g.beginPath();
        g.arc(p.x * RES, p.y * RES, Math.max(0.6, s * 0.5), 0, TAU);
        g.fill();
      } else if (p.t === 'flash') {
        const s = p.r * RES * (1.5 - k * 0.55);
        g.globalAlpha = k * k * 0.8;
        g.drawImage(dot, p.x * RES - s, p.y * RES - s, s * 2, s * 2);
      } else if (p.t === 'ring') {
        g.globalAlpha = k * k * 0.55;
        g.strokeStyle = p.col;
        g.lineWidth = Math.max(1, 1.6 * RES * k);
        g.beginPath();
        g.arc(p.x * RES, p.y * RES, p.r * RES, 0, TAU);
        g.stroke();
      } else if (p.t === 'shard') {
        g.globalAlpha = k;
        g.strokeStyle = p.col;
        g.lineWidth = 1.6 * RES * k;
        g.save();
        g.translate(p.x * RES, p.y * RES);
        g.rotate(p.rot);
        g.beginPath();
        g.moveTo(-p.len * RES, 0);
        g.lineTo(p.len * RES, 0);
        g.stroke();
        g.restore();
      }
    }
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
  }

  // -----------------------------------------------------------------------
  //  scene
  // -----------------------------------------------------------------------
  function drawBackdrop(g) {
    const grad = g.createLinearGradient(0, 0, 0, VH);
    grad.addColorStop(0, '#05060f');
    grad.addColorStop(0.55, '#080a1c');
    grad.addColorStop(1, '#0c0718');
    g.fillStyle = grad;
    g.fillRect(0, 0, VW, VH);

    if (neb) {
      const drift = (tick * 0.06) % VH;
      g.globalCompositeOperation = 'lighter';
      g.globalAlpha = 0.30;
      g.drawImage(neb, 0, drift - VH, VW, VH);
      g.drawImage(neb, 0, drift, VW, VH);
      g.globalAlpha = 1;
      g.globalCompositeOperation = 'source-over';
    }
  }

  function drawStars(g, scroll) {
    g.globalCompositeOperation = 'lighter';
    for (let l = 0; l < 3; l++) {
      for (const s of stars[l]) {
        let y = (s.y + scroll * s.sp) % 256;
        if (y < 0) y += 256;
        const tw = 0.65 + 0.35 * Math.sin(tick * 0.06 + s.ph);
        g.globalAlpha = s.br * tw;
        g.fillStyle = s.c;
        const r = s.r * RES * 0.5;
        if (l === 2) {                       // near layer streaks slightly
          g.fillRect(s.x * RES - r * 0.5, y * RES - r * 1.6, r, r * 3.2);
        } else {
          g.beginPath();
          g.arc(s.x * RES, y * RES, r, 0, TAU);
          g.fill();
        }
      }
    }
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
  }

  // Ribbons behind the divers -- these trace the cosine sweep, which is the
  // whole point of the arcade flight model, so they get to show it off.
  function pushTrails(aliens) {
    for (const a of aliens) {
      if (!a.alive || a.state === 'form') { trails.delete(a); continue; }
      let t = trails.get(a);
      if (!t) { t = []; trails.set(a, t); }
      t.push(a.x, a.y);
      if (t.length > 60) t.splice(0, t.length - 60);
    }
  }

  function drawTrails(g, aliens) {
    g.globalCompositeOperation = 'lighter';
    g.lineCap = 'round';
    g.lineJoin = 'round';
    for (const a of aliens) {
      const t = trails.get(a);
      if (!t || t.length < 6) continue;
      const S = SKIN[a.kind];
      const n = t.length / 2;
      for (let i = 1; i < n; i++) {
        const k = i / n;
        g.globalAlpha = k * k * 0.5;
        g.strokeStyle = S.glow;
        g.lineWidth = Math.max(0.6, k * (a.kind === 'boss' ? 5 : 3.4) * RES * 0.6);
        g.beginPath();
        g.moveTo(t[(i - 1) * 2] * RES, t[(i - 1) * 2 + 1] * RES);
        g.lineTo(t[i * 2] * RES, t[i * 2 + 1] * RES);
        g.stroke();
      }
    }
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
  }

  function facingOf(a) {
    // the engine's 24-step facing, smoothed so the ships turn continuously
    const want = -a.face * (Math.PI / 12);
    let cur = angles.get(a);
    if (cur === undefined) cur = want;
    let d = want - cur;
    while (d > Math.PI) d -= TAU;
    while (d < -Math.PI) d += TAU;
    cur += d * 0.28;
    angles.set(a, cur);
    return cur;
  }

  function drawAliens(g, aliens) {
    for (const a of aliens) {
      if (!a.alive) continue;
      const set = art[a.kind];
      if (!set) continue;
      const frame = a.state === 'form'
        ? set[(tick >> 3) % 3] : set[(tick >> 2) % 3];
      if (!frame) continue;
      const ang = a.state === 'form'
        ? Math.sin(tick * 0.04 + a.col * 0.7) * 0.05 : facingOf(a);
      const bob = a.state === 'form'
        ? Math.sin(tick * 0.05 + a.col * 0.8 + a.row) * 0.6 : 0;
      g.save();
      g.translate(a.x * RES, (a.y + bob) * RES);
      g.rotate(ang);
      g.drawImage(frame, -frame.width / 2, -frame.height / 2);
      g.restore();
    }
  }

  function drawPlayer(g, px, py, alive) {
    if (!alive || !art.ship) return;
    const lean = Math.max(-0.22, Math.min(0.22, (px - (Neo._lastPx || px)) * 0.16));
    Neo._lastPx = px;
    g.save();
    g.translate(px * RES, py * RES);
    g.rotate(lean);
    // thruster
    g.globalCompositeOperation = 'lighter';
    const f = 1 + Math.sin(tick * 0.7) * 0.22;
    for (const side of [-1, 1]) {
      const gx = side * 4.4 * RES, gy = 7 * RES;
      const len = 13 * RES * f;
      const grad = g.createLinearGradient(gx, gy, gx, gy + len);
      grad.addColorStop(0, 'rgba(255,255,255,0.95)');
      grad.addColorStop(0.3, 'rgba(80,220,255,0.7)');
      grad.addColorStop(1, 'rgba(40,90,255,0)');
      g.fillStyle = grad;
      g.beginPath();
      g.moveTo(gx - 2.6 * RES, gy);
      g.lineTo(gx + 2.6 * RES, gy);
      g.lineTo(gx, gy + len);
      g.closePath();
      g.fill();
    }
    g.globalCompositeOperation = 'source-over';
    g.drawImage(art.ship, -art.ship.width / 2, -art.ship.height / 2);
    g.restore();
  }

  function bolt(g, x, y, len, w, c1, c2) {
    g.globalCompositeOperation = 'lighter';
    const grad = g.createLinearGradient(x * RES, (y - len) * RES,
                                        x * RES, (y + len) * RES);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(0.5, c1);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grad;
    g.fillRect((x - w) * RES, (y - len) * RES, w * 2 * RES, len * 2 * RES);
    const s = w * 2.4 * RES;
    g.drawImage(dot, x * RES - s, y * RES - s, s * 2, s * 2);
    g.fillStyle = c2;
    g.fillRect((x - w * 0.35) * RES, (y - len * 0.5) * RES,
               w * 0.7 * RES, len * RES);
    g.globalCompositeOperation = 'source-over';
  }

  // -----------------------------------------------------------------------
  //  HUD
  // -----------------------------------------------------------------------
  function font(g, px, weight) {
    g.font = `${weight || 600} ${px * RES}px "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`;
    try { g.letterSpacing = `${0.09 * px * RES}px`; } catch (e) {}
  }

  function label(g, s, x, y, px, col, align, glow) {
    font(g, px, 700);
    g.textAlign = align || 'left';
    g.textBaseline = 'alphabetic';
    if (glow) { g.shadowBlur = 12 * RES * 0.5; g.shadowColor = glow; }
    g.fillStyle = col;
    g.fillText(s, x * RES, y * RES);
    g.shadowBlur = 0;
    try { g.letterSpacing = '0px'; } catch (e) {}
  }

  function shipGlyph(g, x, y, s, alpha) {
    g.save();
    g.globalAlpha = alpha === undefined ? 1 : alpha;
    g.translate(x * RES, y * RES);
    g.scale(s, s);
    g.drawImage(art.ship, -art.ship.width / 2, -art.ship.height / 2);
    g.restore();
  }

  function drawHud(g, api) {
    const { p0, p1, hi, two, cur, mode, lives, stage } = api;
    g.save();
    // top bar wash
    const bar = g.createLinearGradient(0, 0, 0, 22 * RES);
    bar.addColorStop(0, 'rgba(10,16,40,0.85)');
    bar.addColorStop(1, 'rgba(10,16,40,0)');
    g.fillStyle = bar;
    g.fillRect(0, 0, VW, 22 * RES);

    const blink = (tick >> 4) & 1;
    const live = mode !== 'attract' && mode !== 'select';
    if (!(live && cur === 0 && blink)) label(g, '1UP', 12, 9, 6, '#7ad9ff', 'left', '#1f9fd0');
    label(g, 'HIGH', 112, 9, 6, '#ff7ad0', 'center', '#d0348f');
    if (two && !(live && cur === 1 && blink)) label(g, '2UP', 212, 9, 6, '#7ad9ff', 'right', '#1f9fd0');

    label(g, String(p0).padStart(6, '0'), 12, 19, 8, '#ffffff', 'left', '#3fd9ff');
    label(g, String(hi).padStart(6, '0'), 112, 19, 8, '#ffe9fb', 'center', '#ff7ad0');
    if (two) label(g, String(p1).padStart(6, '0'), 212, 19, 8, '#ffffff', 'right', '#3fd9ff');

    // bottom bar
    const bb = g.createLinearGradient(0, VH - 20 * RES, 0, VH);
    bb.addColorStop(0, 'rgba(10,16,40,0)');
    bb.addColorStop(1, 'rgba(10,16,40,0.9)');
    g.fillStyle = bb;
    g.fillRect(0, VH - 20 * RES, VW, 20 * RES);

    for (let i = 0; i < Math.min(5, Math.max(0, lives - 1)); i++) {
      shipGlyph(g, 12 + i * 13, 247, 0.30, 0.9);
    }

    // stage as stacked chevrons, ten-markers first
    let tens = Math.floor(stage / 10), ones = stage % 10;
    if (tens > 5) { tens = 5; ones = 0; }
    let x = 214;
    g.globalCompositeOperation = 'lighter';
    for (let i = 0; i < ones; i++) { chevron(g, x, 247, 1, '#4fe3ff'); x -= 7; }
    for (let i = 0; i < tens; i++) { chevron(g, x, 247, 1.7, '#ffcf4a'); x -= 12; }
    g.globalCompositeOperation = 'source-over';
    g.restore();
  }

  function chevron(g, x, y, s, col) {
    g.save();
    g.translate(x * RES, y * RES);
    g.scale(s, s);
    g.strokeStyle = col;
    g.lineWidth = 1.6 * RES;
    g.lineCap = 'round';
    g.shadowBlur = 8 * RES * 0.5; g.shadowColor = col;
    g.beginPath();
    g.moveTo(-2.4 * RES, 2.2 * RES);
    g.lineTo(0, -2.4 * RES);
    g.lineTo(2.4 * RES, 2.2 * RES);
    g.stroke();
    g.restore();
  }

  function wordmark(g, y) {
    const t = tick * 0.02;
    const grad = g.createLinearGradient(0, (y - 14) * RES, 0, (y + 6) * RES);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.45, '#6fe4ff');
    grad.addColorStop(0.75, '#c45cff');
    grad.addColorStop(1, '#ff3f9a');
    font(g, 26, 800);
    g.textAlign = 'center';
    g.shadowBlur = 30; g.shadowColor = '#4bd2ff';
    g.fillStyle = grad;
    g.fillText('GALAXIANS', 112 * RES, y * RES);
    g.shadowBlur = 0;
    font(g, 11, 500);
    g.fillStyle = 'rgba(190,220,255,0.85)';
    g.fillText('2 0 2 6', 112 * RES, (y + 16) * RES);
    try { g.letterSpacing = '0px'; } catch (e) {}
  }

  return {
    RES,
    ensure,

    reset() {
      parts.length = 0;
      trails.clear();
      angles.clear();
      shake = 0; flash = 0;
    },

    // --- effect hooks fired by the engine --------------------------------
    fxBoom(x, y, big, kind) {
      const S = SKIN[kind] || SKIN.blue;
      if (big) {
        burst(x, y, S.mid, '#ffffff', 90, 3.6, true);
        burst(x, y, '#ff8a3c', '#fff2b0', 40, 2.2, false);
        shake = Math.max(shake, 13);
        flash = 12; flashCol = 'rgba(255,120,80,';
      } else {
        burst(x, y, S.mid, S.hot, kind === 'boss' ? 46 : 26,
              kind === 'boss' ? 2.6 : 1.9, kind === 'boss');
        shake = Math.max(shake, kind === 'boss' ? 6 : 2.2);
        if (kind === 'boss') { flash = 7; flashCol = 'rgba(255,200,90,'; }
      }
    },
    fxShot(x, y) {
      for (let i = 0; i < 6; i++) spark(x, y, '#9df0ff', 1.1, rnd(6, 14), 1.1);
    },
    fxHit(x, y) {
      for (let i = 0; i < 8; i++) spark(x, y, '#ffe9a0', 1.6, rnd(8, 18), 1.2);
    },

    // Effects advance with the simulation, not with the frame: the main loop
    // can run several updates for one draw, and particles must not pile up.
    step(aliens) {
      tick++;
      updateParts();
      pushTrails(aliens);
      if (shake > 0) shake *= 0.86;
      if (flash > 0) flash--;
    },

    // --- the frame -------------------------------------------------------
    render(api) {
      ensure(api.canvas, api.ctx);
      if (!sx) return;

      const g = sx;
      g.setTransform(1, 0, 0, 1, 0, 0);
      drawBackdrop(g);
      drawStars(g, api.scroll);

      const sh = shake > 0.15 ? shake : 0;
      g.save();
      if (sh) g.translate(rnd(-sh, sh) * RES, rnd(-sh, sh) * RES);

      if (api.mode !== 'attract' && api.mode !== 'select') {
        drawTrails(g, api.aliens);
        drawAliens(g, api.aliens);
        drawPlayer(g, api.px, api.py, api.shipVisible);
        for (const s of api.pshots) {
          bolt(g, s.x, s.y, 7, 1.5, 'rgba(120,255,255,0.95)', '#ffffff');
        }
        for (const b of api.eshots) {
          bolt(g, b.x, b.y, 5, 1.4, 'rgba(255,90,180,0.9)', '#ffe6f6');
        }
        for (const p of api.pops) {
          const k = p.t / 48;
          g.globalAlpha = Math.min(1, k * 2);
          label(g, String(p.v), p.x, p.y, 9, '#ffd9f4', 'center', '#ff5cc0');
          g.globalAlpha = 1;
        }
      }
      drawParts(g);
      g.restore();

      if (flash > 0) {
        g.fillStyle = flashCol + (flash / 14 * 0.35) + ')';
        g.fillRect(0, 0, VW, VH);
      }

      api.overlay(g, {
        label, wordmark, font, shipGlyph, chevron, art, SKIN, RES, VW, VH, tick,
      });

      drawHud(g, api);

      // vignette
      const vg = g.createRadialGradient(VW / 2, VH / 2, VH * 0.32,
                                        VW / 2, VH / 2, VH * 0.72);
      vg.addColorStop(0, 'rgba(0,0,0,0)');
      vg.addColorStop(1, 'rgba(0,0,0,0.55)');
      g.fillStyle = vg;
      g.fillRect(0, 0, VW, VH);

      // --- compose: scene, then a blurred copy added back as bloom -------
      cx.setTransform(1, 0, 0, 1, 0, 0);
      cx.globalCompositeOperation = 'source-over';
      cx.globalAlpha = 1;
      cx.drawImage(scene, 0, 0);
      if (bx && canBlur) {
        bx.setTransform(1, 0, 0, 1, 0, 0);
        bx.globalCompositeOperation = 'source-over';
        bx.clearRect(0, 0, bloom.width, bloom.height);
        bx.filter = 'blur(3px)';
        bx.drawImage(scene, 0, 0, bloom.width, bloom.height);
        bx.filter = 'none';
        cx.globalCompositeOperation = 'lighter';
        cx.globalAlpha = 0.42;
        cx.drawImage(bloom, 0, 0, VW, VH);
        cx.globalAlpha = 1;
        cx.globalCompositeOperation = 'source-over';
      }
    },
  };
})();

</script>
<script>
// -------------------------------------------------------------------------
//  GALAXIANS VECTOR -- a phosphor vector-monitor rendering.
//
//  The look of an XY display: no fills anywhere, everything is a stroked
//  outline drawn by a beam, with an overbright core, a soft halo, and short
//  phosphor persistence so fast movement smears.  Explosions come apart into
//  tumbling line fragments the way Asteroids does.
//
//  Exposes the same interface as Neo, and shares its audio, so the engine
//  treats the two modern versions identically.  The simulation is untouched.
// -------------------------------------------------------------------------
const Vec = (() => {
  const RES = 4;
  let VW = 0, VH = 0;

  let cx = null;
  let beam, bmx;                       // the persistent phosphor layer
  let bloom, bx;
  let canBlur = true;
  let inited = false;

  const parts = [];
  const angles = new Map();
  let shake = 0, flash = 0;
  let tick = 0;
  let starsArr = [];

  // its own random stream, so the simulation's sequence is never touched
  let seed = 0x51f3c9d;
  function nrand() {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    return seed / 4294967296;
  }
  const rnd = (a, b) => a + nrand() * (b - a);

  const TAU = Math.PI * 2;

  const HUE = {
    blue:   '#5cf0ff',
    purple: '#cc7cff',
    red:    '#ff7a4a',
    boss:   '#ffd24a',
  };
  const PLAYER_C = '#9dffd8';

  function mkCanvas(w, h) {
    const c = (typeof document !== 'undefined' && document.createElement)
      ? document.createElement('canvas') : null;
    if (!c) return null;
    c.width = w; c.height = h;
    return c;
  }

  // -----------------------------------------------------------------------
  //  shapes -- Vectrex sparse: one closed outline per object, few segments,
  //  and sized to sit inside the swarm's 16px column / 12px row pitch so
  //  neighbours never touch.
  // -----------------------------------------------------------------------

  // Sizes in game pixels.  Half-width * 2 must stay under 16, height under 12.
  const U_ALIEN = 5.2, U_BOSS = 6.2, U_PLAYER = 6.8;

  // A single silhouette: nose down, wings swept back, two short antennae
  // folded into the same outline rather than drawn as extra strokes.
  const ALIEN = [
    [0, 1.00], [0.42, 0.18], [1.00, -0.22], [0.66, -0.60], [0.26, -0.36],
    [0.17, -0.98], [-0.17, -0.98], [-0.26, -0.36], [-0.66, -0.60],
    [-1.00, -0.22], [-0.42, 0.18],
  ];
  // wings-in pose for the idle flap
  const ALIEN_F = [
    [0, 1.00], [0.38, 0.16], [0.80, -0.34], [0.56, -0.62], [0.24, -0.34],
    [0.17, -0.98], [-0.17, -0.98], [-0.24, -0.34], [-0.56, -0.62],
    [-0.80, -0.34], [-0.38, 0.16],
  ];
  const BOSS_INNER = [[0, 0.34], [0.22, 0], [0, -0.34], [-0.22, 0]];

  const PLAYER_SHAPE = [
    [0, -1.00], [0.22, -0.18], [0.92, 0.42], [0.40, 0.36],
    [0.30, 0.82], [-0.30, 0.82], [-0.40, 0.36], [-0.92, 0.42],
    [-0.22, -0.18],
  ];

  // Line weights, in game pixels -- a Vectrex beam is hairline.
  const W_CORE = 0.42, W_HALO = 1.15;

  // Every stroke sets its own alpha, so a caller that wants to fade a whole
  // object has to go through this rather than setting globalAlpha itself.
  let alphaMul = 1;

  function poly(g, pts, u, close, col, w, alpha) {
    g.strokeStyle = col;
    g.lineWidth = w;
    g.globalAlpha = alpha * alphaMul;
    g.beginPath();
    for (let i = 0; i < pts.length; i++) {
      const x = pts[i][0] * u, y = pts[i][1] * u;
      if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
    }
    if (close) g.closePath();
    g.stroke();
  }

  // A hairline core with a faint wide halo around it.  The halo is what makes
  // it look like light rather than ink; keep it dim or the shape fills in.
  function stroked(g, pts, u, close, col) {
    poly(g, pts, u, close, col, W_HALO * RES, 0.13);
    poly(g, pts, u, close, col, W_CORE * RES, 1);
  }

  function drawAlienShape(g, kind, u, flap, alpha) {
    const col = HUE[kind] || HUE.blue;
    alphaMul = alpha === undefined ? 1 : alpha;
    stroked(g, flap ? ALIEN_F : ALIEN, u, true, col);
    if (kind === 'boss') stroked(g, BOSS_INNER, u, true, '#fff2b0');
    alphaMul = 1;
  }

  function drawStars(g, scroll) {
    g.globalCompositeOperation = 'lighter';
    for (const s of starsArr) {
      let y = (s.y + scroll * s.sp) % 256;
      if (y < 0) y += 256;
      g.globalAlpha = s.br * (0.55 + 0.45 * Math.sin(tick * 0.05 + s.ph));
      g.fillStyle = '#cfeaff';
      g.fillRect(s.x * RES, y * RES, RES * 0.6, RES * 0.6);
    }
    g.globalAlpha = 1;
  }

  function makeStars() {
    starsArr = [];
    for (let i = 0; i < 120; i++) {
      starsArr.push({
        x: nrand() * 224, y: nrand() * 256,
        sp: 0.3 + nrand() * 1.0,
        br: 0.25 + nrand() * 0.5,
        ph: nrand() * TAU,
      });
    }
  }

  function ensure(canvasEl, ctx2d) {
    VW = 224 * RES; VH = 256 * RES;
    cx = ctx2d;
    if (inited) return;
    inited = true;
    beam = mkCanvas(VW, VH); bmx = beam && beam.getContext('2d');
    bloom = mkCanvas(VW >> 2, VH >> 2); bx = bloom && bloom.getContext('2d');
    if (bx) {
      try { bx.filter = 'blur(4px)'; canBlur = bx.filter === 'blur(4px)'; }
      catch (e) { canBlur = false; }
      bx.filter = 'none';
    }
    if (bmx) { bmx.lineCap = 'round'; bmx.lineJoin = 'round'; }
    makeStars();
  }

  // -----------------------------------------------------------------------
  //  effects -- everything is made of lines
  // -----------------------------------------------------------------------
  function frag(x, y, col, spd, life, len) {
    const a = nrand() * TAU, v = rnd(spd * 0.3, spd);
    parts.push({ t: 'frag', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
                 rot: nrand() * TAU, spin: rnd(-0.3, 0.3),
                 len, life, max: life, col });
  }

  function updateParts() {
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      if (--p.life <= 0) { parts.splice(i, 1); continue; }
      if (p.t === 'frag') {
        p.x += p.vx; p.y += p.vy;
        p.vx *= 0.985; p.vy *= 0.985;
        p.rot += p.spin;
      } else if (p.t === 'ring') {
        p.r += (p.max - p.r) * 0.14;
      }
    }
  }

  function drawParts(g) {
    g.globalCompositeOperation = 'lighter';
    for (const p of parts) {
      const k = p.life / p.max;
      if (p.t === 'frag') {
        g.save();
        g.translate(p.x * RES, p.y * RES);
        g.rotate(p.rot);
        const pts = [[-p.len, 0], [p.len, 0]];
        poly(g, pts, RES, false, p.col, W_HALO * RES, k * 0.14);
        poly(g, pts, RES, false, p.col, W_CORE * RES, k);
        g.restore();
      } else if (p.t === 'ring') {
        // a polygon, not a circle -- vector hardware had no curves
        const n = 14, pts = [];
        for (let i = 0; i < n; i++) {
          const a = (i / n) * TAU + p.rot;
          pts.push([p.x + Math.cos(a) * p.r, p.y + Math.sin(a) * p.r]);
        }
        poly(g, pts, RES, true, p.col, W_HALO * RES, k * k * 0.12);
        poly(g, pts, RES, true, p.col, W_CORE * RES, k * k * 0.9);
      }
    }
    g.globalAlpha = 1;
  }

  function facingOf(a) {
    const want = -a.face * (Math.PI / 12);
    let cur = angles.get(a);
    if (cur === undefined) cur = want;
    let d = want - cur;
    while (d > Math.PI) d -= TAU;
    while (d < -Math.PI) d += TAU;
    cur += d * 0.28;
    angles.set(a, cur);
    return cur;
  }

  function hud(g, api) {
    const { p0, p1, hi, two, cur, mode, lives, stage } = api;
    g.globalCompositeOperation = 'lighter';
    g.lineJoin = 'round';

    const put = (s, x, y, px, col, align) => {
      g.font = `700 ${px * RES}px "Inter", system-ui, -apple-system, sans-serif`;
      try { g.letterSpacing = `${0.12 * px * RES}px`; } catch (e) {}
      g.textAlign = align || 'left';
      g.lineWidth = Math.max(1, px * RES * 0.09);
      g.strokeStyle = col;
      g.globalAlpha = 0.25;
      g.lineWidth = Math.max(1, px * RES * 0.24);
      g.strokeText(s, x * RES, y * RES);
      g.globalAlpha = 1;
      g.lineWidth = Math.max(1, px * RES * 0.09);
      g.strokeText(s, x * RES, y * RES);
      try { g.letterSpacing = '0px'; } catch (e) {}
    };

    const blink = (tick >> 4) & 1;
    const live = mode !== 'attract' && mode !== 'select';
    if (!(live && cur === 0 && blink)) put('1UP', 12, 9, 6, '#7fe8ff');
    put('HIGH', 112, 9, 6, '#ff9ad8', 'center');
    if (two && !(live && cur === 1 && blink)) put('2UP', 212, 9, 6, '#7fe8ff', 'right');
    put(String(p0).padStart(6, '0'), 12, 19, 8, '#dffaff');
    put(String(hi).padStart(6, '0'), 112, 19, 8, '#ffd9f2', 'center');
    if (two) put(String(p1).padStart(6, '0'), 212, 19, 8, '#dffaff', 'right');

    // reserve ships, drawn as the real outline at badge size
    for (let i = 0; i < Math.min(5, Math.max(0, lives - 1)); i++) {
      g.save();
      g.translate((10 + i * 12) * RES, 247 * RES);
      stroked(g, PLAYER_SHAPE, 3.6 * RES, true, PLAYER_C);
      g.restore();
    }

    let tens = Math.floor(stage / 10), ones = stage % 10;
    if (tens > 5) { tens = 5; ones = 0; }
    let x = 214;
    const tick10 = [[0, -2.6], [2.4, 2.2], [-2.4, 2.2]];
    for (let i = 0; i < ones; i++) {
      g.save(); g.translate(x * RES, 247 * RES);
      stroked(g, tick10, RES, true, '#5cf0ff'); g.restore(); x -= 8;
    }
    for (let i = 0; i < tens; i++) {
      g.save(); g.translate(x * RES, 247 * RES); g.scale(1.6, 1.6);
      stroked(g, tick10, RES, true, '#ffd24a'); g.restore(); x -= 13;
    }
    g.globalAlpha = 1;
  }

  function wordmark(g, y) {
    g.globalCompositeOperation = 'lighter';
    g.font = `800 ${24 * RES}px "Inter", system-ui, -apple-system, sans-serif`;
    try { g.letterSpacing = `${3 * RES}px`; } catch (e) {}
    g.textAlign = 'center';
    g.strokeStyle = '#7fffd8';
    g.globalAlpha = 0.22;
    g.lineWidth = 5 * RES * 0.55;
    g.strokeText('GALAXIANS', 112 * RES, y * RES);
    g.globalAlpha = 1;
    g.lineWidth = 1.7 * RES * 0.55;
    g.strokeText('GALAXIANS', 112 * RES, y * RES);
    g.font = `500 ${10 * RES}px "Inter", system-ui, sans-serif`;
    g.lineWidth = 1.1 * RES * 0.55;
    g.strokeStyle = '#9dffd8';
    g.strokeText('V E C T O R', 112 * RES, (y + 16) * RES);
    try { g.letterSpacing = '0px'; } catch (e) {}
  }

  function label(g, s, x, y, px, col, align) {
    g.globalCompositeOperation = 'lighter';
    g.font = `700 ${px * RES}px "Inter", system-ui, -apple-system, sans-serif`;
    try { g.letterSpacing = `${0.12 * px * RES}px`; } catch (e) {}
    g.textAlign = align || 'left';
    g.strokeStyle = col;
    g.globalAlpha = 0.22;
    g.lineWidth = Math.max(1, px * RES * 0.26);
    g.strokeText(s, x * RES, y * RES);
    g.globalAlpha = 1;
    g.lineWidth = Math.max(1, px * RES * 0.10);
    g.strokeText(s, x * RES, y * RES);
    try { g.letterSpacing = '0px'; } catch (e) {}
  }

  return {
    RES,
    ensure,
    reset() { parts.length = 0; angles.clear(); shake = 0; flash = 0;
              if (bmx) bmx.clearRect(0, 0, VW, VH); },

    step(aliens) {
      tick++;
      updateParts();
      if (shake > 0) shake *= 0.86;
      if (flash > 0) flash--;
    },

    fxBoom(x, y, big, kind) {
      const col = HUE[kind] || HUE.blue;
      parts.push({ t: 'ring', x, y, r: 1, max: big ? 34 : 15,
                   life: big ? 30 : 18, col: big ? '#ffffff' : col,
                   rot: nrand() * TAU });
      const n = big ? 26 : (kind === 'boss' ? 14 : 8);
      for (let i = 0; i < n; i++) {
        frag(x, y, col, big ? 2.2 : 1.3, rnd(24, big ? 80 : 46),
             rnd(1.4, big ? 4 : 2.6));
      }
      shake = Math.max(shake, big ? 12 : (kind === 'boss' ? 5 : 2));
      if (big) flash = 10;
    },
    fxShot(x, y) { },
    fxHit(x, y) { for (let i = 0; i < 4; i++) frag(x, y, '#ffffff', 1.2, 10, 1.2); },

    render(api) {
      ensure(api.canvas, api.ctx);
      if (!bmx) return;
      const g = bmx;
      g.setTransform(1, 0, 0, 1, 0, 0);

      // phosphor decay: never a hard clear, so the beam leaves a short trail
      g.globalCompositeOperation = 'source-over';
      g.globalAlpha = 1;
      g.fillStyle = 'rgba(0,0,0,0.52)';
      g.fillRect(0, 0, VW, VH);

      g.globalCompositeOperation = 'lighter';
      drawStars(g, api.scroll);

      const sh = shake > 0.15 ? shake : 0;
      g.save();
      if (sh) g.translate(rnd(-sh, sh) * RES, rnd(-sh, sh) * RES);

      if (api.mode !== 'attract' && api.mode !== 'select') {
        for (const a of api.aliens) {
          if (!a.alive) continue;
          const u = (a.kind === 'boss' ? U_BOSS : U_ALIEN) * RES;
          const ang = a.state === 'form'
            ? Math.sin(tick * 0.04 + a.col * 0.7) * 0.04 : facingOf(a);
          const flap = a.state === 'form'
            ? (((tick >> 4) & 1) ? 1 : 0) : (((tick >> 3) & 1) ? 1 : 0);
          g.save();
          g.translate(a.x * RES, a.y * RES);
          g.rotate(ang);
          drawAlienShape(g, a.kind, u, flap);
          g.restore();
        }

        if (api.shipVisible) {
          g.save();
          g.translate(api.px * RES, api.py * RES);
          stroked(g, PLAYER_SHAPE, U_PLAYER * RES, true, PLAYER_C);
          // thrust, two short flickering strokes
          const f = 1 + Math.sin(tick * 0.8) * 0.3;
          for (const side of [-1, 1]) {
            poly(g, [[side * 0.16, 0.84], [side * 0.16, 0.84 + 0.5 * f]],
                 U_PLAYER * RES, false, '#8ff0ff', W_CORE * RES, 0.85);
          }
          g.restore();
        }

        for (const b of api.pshots) {
          const s = [[b.x, b.y - 4], [b.x, b.y + 4]];
          poly(g, s, RES, false, '#ffffff', W_HALO * RES, 0.2);
          poly(g, s, RES, false, '#ffffff', W_CORE * RES, 1);
        }
        for (const b of api.eshots) {
          const s = [[b.x, b.y - 3], [b.x, b.y + 3]];
          poly(g, s, RES, false, '#ff7ab0', W_HALO * RES, 0.2);
          poly(g, s, RES, false, '#ffd0e6', W_CORE * RES, 1);
        }
        for (const p of api.pops) {
          label(g, String(p.v), p.x, p.y, 9, '#ffb0e0', 'center');
        }
      }
      drawParts(g);
      g.restore();
      g.globalAlpha = 1;
      g.globalCompositeOperation = 'source-over';

      // --- compose ------------------------------------------------------
      cx.setTransform(1, 0, 0, 1, 0, 0);
      cx.globalCompositeOperation = 'source-over';
      cx.globalAlpha = 1;
      cx.fillStyle = '#000';
      cx.fillRect(0, 0, VW, VH);
      cx.drawImage(beam, 0, 0);
      if (bx && canBlur) {
        bx.setTransform(1, 0, 0, 1, 0, 0);
        bx.globalCompositeOperation = 'source-over';
        bx.clearRect(0, 0, bloom.width, bloom.height);
        bx.filter = 'blur(4px)';
        bx.drawImage(beam, 0, 0, bloom.width, bloom.height);
        bx.filter = 'none';
        cx.globalCompositeOperation = 'lighter';
        cx.globalAlpha = 0.5;
        cx.drawImage(bloom, 0, 0, VW, VH);
        cx.globalAlpha = 1;
        cx.globalCompositeOperation = 'source-over';
      }

      // Text and HUD are drawn after the composite, straight onto the output.
      // Put them on the beam layer and the phosphor decay smears them into an
      // unreadable ghost.
      cx.save();
      api.overlay(cx, { label, wordmark, RES, VW, VH, tick,
                        stroked, HUE, drawAlienShape });
      hud(cx, api);
      cx.restore();
      cx.globalAlpha = 1;
      cx.globalCompositeOperation = 'source-over';

      if (flash > 0) {
        cx.fillStyle = 'rgba(255,255,255,' + (flash / 30) + ')';
        cx.fillRect(0, 0, VW, VH);
      }
    },
  };
})();

</script>
<script>
// -------------------------------------------------------------------------
//  GALAXIAN X -- the widescreen build.
//
//  The other three versions draw a 224x256 portrait frame and scale it up.
//  This one takes the whole window and composes a landscape scene *around*
//  the playfield: the backdrop, planet and starfield run edge to edge, the
//  playfield sits in the middle inside a lit containment corridor, and the
//  flanks are cockpit panels carrying the score, the loadout and the wave
//  readout.  Divers that swing past the corridor rails fly out into the open
//  screen, which is the whole reason the composition works.
//
//  The simulation is untouched -- same formation, same peel-off arc, same
//  cosine sweep, same bombing heights.  What X adds (power-ups, skill tiers,
//  the combo) lives in the engine behind xr(); everything in this file is
//  presentation, and it reads a snapshot rather than reaching into state.
//
//  Like the other renderers it keeps its own random stream, so it never
//  consumes a number the simulation was going to draw.
// -------------------------------------------------------------------------
const Xr = (() => {
  const RES = 4;                 // kept for interface compatibility; unused
  const FULL = true;             // "size me to the window, not to 224x256"
  const GW = 224, GH = 256;      // the game's own coordinate space
  const TAU = Math.PI * 2;

  // Sprites are baked once at REF device pixels per *game* pixel and then
  // drawn at L.sc / REF, so a shape written as `1.1 * k` where `k = REF * n`
  // occupies 1.1 * n game pixels however big the window is.  Getting this
  // wrong is invisible in isolation and obvious next to the 16px column pitch:
  // the first pass baked everything at half scale and the swarm looked sparse.
  const REF = 8;
  const K_ALIEN = REF * 5.0;     // wing tips reach 1.10k -> 11 game px across
  const K_BOSS = REF * 5.8;
  const K_SHIP = REF * 6.2;      // wings reach 1.02k -> 12.6 game px across
  const K_POD = REF * 3.4;

  let cx = null;                 // the visible context
  let VW = 0, VH = 0;            // backing store size, device px
  let scene, sx;                 // full-res offscreen we compose into
  let b1, b1x, b2, b2x;          // two bloom taps at 1/4 and 1/8
  let neb, planet, moon;         // pre-baked backdrop pieces
  let canBlur = true;
  let built = 0;                 // the VW*VH the buffers were built for

  // playfield placement, recomputed on resize
  const L = { x: 0, y: 0, w: 0, h: 0, sc: 1, panel: 0, gut: 0, pad: 0, wide: true };

  const art = {};                // baked sprites
  const pods = {};               // baked power-up capsules
  let dot = null;

  const parts = [];
  const trails = new Map();
  const angles = new Map();
  const dust = [];
  const stars = [];
  let shake = 0, flash = 0, flashCol = '0,0,0', warp = 0, ca = 0;
  let tick = 0, lastPx = null, railPulse = 0;

  // --- private random stream ----------------------------------------------
  let seed = 0x7ac3f19;
  function nrand() {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    return seed / 4294967296;
  }
  const rnd = (a, b) => a + nrand() * (b - a);
  const pick = a => a[(nrand() * a.length) | 0];

  function mkCanvas(w, h) {
    const c = (typeof document !== 'undefined' && document.createElement)
      ? document.createElement('canvas') : null;
    if (!c) return null;
    c.width = Math.max(1, w | 0); c.height = Math.max(1, h | 0);
    return c;
  }

  // --- palette ------------------------------------------------------------
  const SKIN = {
    blue:   { hot: '#e6feff', mid: '#1fc8f5', low: '#062a4d', glow: '#45e0ff' },
    purple: { hot: '#fbd8ff', mid: '#b141ef', low: '#33075a', glow: '#d264ff' },
